services:
  nginx:
    image: public.ecr.aws/docker/library/nginx:latest
    container_name: nginx
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ../frontend/build/client:/home/isucon/webapp/public:ro
    ports:
      - "8080:80"
    # 本番は nginx→localhost でループバック限定の tw_reuse(=2) が効くが、
    # docker の bridge 越しでは効かずエフェメラルポートが枯渇するため
    sysctls:
      net.ipv4.tcp_tw_reuse: 1
    depends_on:
      - webapp
  webapp:
    build:
      context: ../webapp/go
      dockerfile: ../../development/dockerfiles/Dockerfile.go
      args:
        # GIT_COMMIT=$(git rev-parse --short HEAD) docker compose ... up --build で service.version になる
        GIT_COMMIT: ${GIT_COMMIT:-}
    image: webapp-go
    expose:
      - 8080
    volumes:
      - ../webapp/sql:/home/isucon/webapp/sql
    working_dir: /home/isucon/webapp/go
    depends_on:
      db:
        condition: service_healthy
    environment:
      ISUCON_DB_HOST: db
      # OTel: ホスト上の Splunk Observability Studio (obstudio) の OTLP/HTTP へ送る
      OTEL_SERVICE_NAME: isuride
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local-orbstack
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      # otelsql: 既存の db.sql.latency に加えて db.client.operation.duration と db.query.text も出す
      OTEL_SEMCONV_STABILITY_OPT_IN: ${OTEL_SEMCONV_STABILITY_OPT_IN:-database/dup}
      # アプリログはローカルの obstudio だけに送る (クラウドへは送らない)
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-otlp}
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://host.docker.internal:4318/v1/logs
      # 既定のキュー(2048)ではベンチ中にスパンが溢れて親スパンが落ちるため拡張
      OTEL_BSP_MAX_QUEUE_SIZE: "65536"
      OTEL_BSP_MAX_EXPORT_BATCH_SIZE: "4096"
      OTEL_BSP_SCHEDULE_DELAY: "1000"
    # webapp→db も本番はループバック。nginx と同じ理由
    sysctls:
      net.ipv4.tcp_tw_reuse: 1
    extra_hosts:
      - "host.docker.internal:host-gateway"
  db:
    image: public.ecr.aws/docker/library/mysql:8
    environment:
      ENV: local-dev
      MYSQL_ROOT_PASSWORD: isucon
      MYSQL_DATABASE: isucon
    ports:
      - 3306:3306
    volumes:
      - ./mysql/db:/var/lib/mysql
      - ../webapp/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: mysqladmin ping -h 127.0.0.1 -uisucon -pisucon
      start_period: 60s
  matcher:
    image: mirror.gcr.io/curlimages/curl:latest
    command: /bin/sh -c "while true; do curl -s http://nginx/api/internal/matching; sleep 0.5; done"
